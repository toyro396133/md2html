<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkBolt — Modern URL Shortener</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --bg-card: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --accent-light: rgba(99, 102, 241, 0.1);
            --border: #e2e8f0;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            --radius: 16px;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #10b981;
            --input-bg: #f8fafc;
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #090d16 0%, #1e1b4b 100%);
            --bg-card: #111827;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #818cf8;
            --accent-hover: #6366f1;
            --accent-light: rgba(129, 140, 248, 0.15);
            --border: #1f2937;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            --danger: #f87171;
            --danger-hover: #ef4444;
            --success: #34d399;
            --input-bg: #1f2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
            padding: 0 0.5rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 800;
            font-size: 1.5rem;
            letter-spacing: -0.025em;
            color: var(--text-primary);
            text-decoration: none;
        }

        .logo-icon {
            background: var(--accent);
            color: white;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .theme-toggle {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow);
        }

        .theme-toggle:hover {
            border-color: var(--accent);
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 2rem;
            box-shadow: var(--shadow);
            margin-bottom: 2rem;
        }

        .hero-title {
            font-size: 1.875rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .hero-subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            text-align: center;
            margin-bottom: 2rem;
        }

        .form-group {
            position: relative;
            margin-bottom: 1.25rem;
        }

        .url-input-wrapper {
            display: flex;
            gap: 0.75rem;
        }

        input[type="url"] {
            flex: 1;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0.875rem 1rem 0.875rem 2.75rem;
            font-size: 1rem;
            color: var(--text-primary);
            outline: none;
        }

        input[type="url"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-light);
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            pointer-events: none;
        }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 0.875rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            white-space: nowrap;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
            transition: transform 0.1s ease, background-color 0.2s ease;
        }

        .btn:hover {
            background: var(--accent-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .error-message {
            color: var(--danger);
            font-size: 0.85rem;
            margin-top: 0.5rem;
            display: none;
            padding-left: 0.25rem;
        }

        .error-message.visible {
            display: block;
        }

        /* Result Box */
        .result-box {
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem;
            margin-top: 1.5rem;
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            animation: fadeIn 0.3s ease;
        }

        .result-box.visible {
            display: flex;
        }

        .short-url-display {
            font-weight: 600;
            color: var(--accent);
            text-decoration: none;
            word-break: break-all;
            font-size: 0.95rem;
        }

        .short-url-display:hover {
            text-decoration: underline;
        }

        /* History Section */
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
        }

        .history-title {
            font-size: 1.125rem;
            font-weight: 700;
        }

        .clear-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            padding: 0.25rem 0.5rem;
            border-radius: 6px;
        }

        .clear-btn:hover {
            color: var(--danger);
            background: rgba(239, 68, 68, 0.1);
        }

        .url-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 0.25rem;
        }

        .url-item {
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .url-item-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
        }

        .original-url {
            color: var(--text-secondary);
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 320px;
        }

        .url-item-actions {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .action-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 0.4rem 0.75rem;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
        }

        .action-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .action-btn.delete:hover {
            border-color: var(--danger);
            color: var(--danger);
            background: rgba(239, 68, 68, 0.05);
        }

        .empty-state {
            text-align: center;
            padding: 2.5rem 1rem;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--text-primary);
            color: var(--bg-card);
            padding: 0.75rem 1.5rem;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
            pointer-events: none;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 640px) {
            .url-input-wrapper {
                flex-direction: column;
            }
            .card {
                padding: 1.25rem;
            }
            .original-url {
                max-width: 200px;
            }
        }
    </style>
</head>
<body data-theme="light">
    <div class="container">
        <header>
            <a href="#" class="logo">
                <div class="logo-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                </div>
                LinkBolt
            </a>
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                <svg id="sunIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                <svg id="moonIcon" style="display:none;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
        </header>

        <div class="card">
            <h1 class="hero-title">Shorten Your Links Instantly</h1>
            <p class="hero-subtitle">Transform long, unwieldy URLs into clean, memorable short links.</p>
            
            <form id="urlForm">
                <div class="form-group">
                    <div class="url-input-wrapper">
                        <span class="input-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                        </span>
                        <input type="url" id="urlInput" placeholder="Paste your long URL here (e.g. https://example.com)" autocomplete="off">
                        <button type="submit" class="btn">
                            <span>Shorten</span>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                        </button>
                    </div>
                    <div class="error-message" id="errorMessage">Please enter a valid URL (including http:// or https://).</div>
                </div>
            </form>

            <div class="result-box" id="resultBox">
                <div>
                    <div style="font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 0.2rem;">Your Short Link</div>
                    <a href="#" target="_blank" class="short-url-display" id="shortUrlDisplay"></a>
                </div>
                <button class="action-btn" id="copyResultBtn">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                    Copy
                </button>
            </div>
        </div>

        <div class="card">
            <div class="history-header">
                <h2 class="history-title">Saved Links</h2>
                <button class="clear-btn" id="clearAllBtn" style="display: none;">Clear All</button>
            </div>
            <div class="url-list" id="urlList">
                <div class="empty-state">No saved links yet. Shorten a URL to get started!</div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">Copied to clipboard!</div>

    <script>
        // DOM Elements
        const themeToggle = document.getElementById('themeToggle');
        const sunIcon = document.getElementById('sunIcon');
        const moonIcon = document.getElementById('moonIcon');
        const urlForm = document.getElementById('urlForm');
        const urlInput = document.getElementById('urlInput');
        const errorMessage = document.getElementById('errorMessage');
        const resultBox = document.getElementById('resultBox');
        const shortUrlDisplay = document.getElementById('shortUrlDisplay');
        const copyResultBtn = document.getElementById('copyResultBtn');
        const urlList = document.getElementById('urlList');
        const clearAllBtn = document.getElementById('clearAllBtn');
        const toast = document.getElementById('toast');

        // State & LocalStorage
        let savedUrls = JSON.parse(localStorage.getItem('linkbolt_urls')) || [];

        // Theme Initialization
        const savedTheme = localStorage.getItem('linkbolt_theme') || 'light';
        document.body.setAttribute('data-theme', savedTheme);
        updateThemeIcons(savedTheme);

        themeToggle.addEventListener('click', () => {
            const currentTheme = document.body.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.body.setAttribute('data-theme', newTheme);
            localStorage.setItem('linkbolt_theme', newTheme);
            updateThemeIcons(newTheme);
        });

        function updateThemeIcons(theme) {
            if (theme === 'dark') {
                sunIcon.style.display = 'none';
                moonIcon.style.display = 'block';
            } else {
                sunIcon.style.display = 'block';
                moonIcon.style.display = 'none';
            }
        }

        // URL Validation helper
        function isValidUrl(string) {
            try {
                const url = new URL(string);
                return url.protocol === 'http:' || url.protocol === 'https:';
            } catch (_) {
                return false;
            }
        }

        // Generate short code
        function generateShortCode() {
            const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let code = '';
            for (let i = 0; i < 6; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }

        // Toast notification
        function showToast(message = 'Copied to clipboard!') {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        // Render List
        function renderUrls() {
            if (savedUrls.length === 0) {
                urlList.innerHTML = '<div class="empty-state">No saved links yet. Shorten a URL to get started!</div>';
                clearAllBtn.style.display = 'none';
                return;
            }

            clearAllBtn.style.display = 'block';
            urlList.innerHTML = '';

            savedUrls.forEach((item) => {
                const itemEl = document.createElement('div');
                itemEl.className = 'url-item';
                
                const shortUrlFull = `${window.location.origin}${window.location.pathname}#${item.code}`;

                itemEl.innerHTML = `
                    <div class="url-item-top">
                        <div>
                            <a href="${shortUrlFull}" target="_blank" class="short-url-display" style="font-size: 1rem; margin-bottom: 0.2rem; display: block;">${shortUrlFull}</a>
                            <div class="original-url" title="${item.original}">${item.original}</div>
                        </div>
                        <div class="url-item-actions">
                            <button class="action-btn" onclick="copyToClipboard('${shortUrlFull}')">
                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                                Copy
                            </button>
                            <button class="action-btn delete" onclick="deleteUrl('${item.id}')">
                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                            </button>
                        </div>
                    </div>
                `;
                urlList.appendChild(itemEl);
            });
        }

        // Form Submit Handler
        urlForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const urlVal = urlInput.value.trim();

            if (!isValidUrl(urlVal)) {
                errorMessage.classList.add('visible');
                urlInput.style.borderColor = 'var(--danger)';
                return;
            }

            errorMessage.classList.remove('visible');
            urlInput.style.borderColor = 'var(--border)';

            const code = generateShortCode();
            const newItem = {
                id: Date.now().toString(),
                original: urlVal,
                code: code,
                createdAt: new Date().toLocaleDateString()
            };

            savedUrls.unshift(newItem);
            localStorage.setItem('linkbolt_urls', JSON.stringify(savedUrls));
            renderUrls();

            const shortUrlFull = `${window.location.origin}${window.location.pathname}#${code}`;
            shortUrlDisplay.href = shortUrlFull;
            shortUrlDisplay.textContent = shortUrlFull;
            resultBox.classList.add('visible');

            urlInput.value = '';
        });

        // Input reset error on type
        urlInput.addEventListener('input', () => {
            if (errorMessage.classList.contains('visible')) {
                errorMessage.classList.remove('visible');
                urlInput.style.borderColor = 'var(--border)';
            }
        });

        // Copy Global Function
        window.copyToClipboard = function(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast();
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        };

        copyResultBtn.addEventListener('click', () => {
            copyToClipboard(shortUrlDisplay.href);
        });

        // Delete Individual
        window.deleteUrl = function(id) {
            savedUrls = savedUrls.filter(item => item.id !== id);
            localStorage.setItem('linkbolt_urls', JSON.stringify(savedUrls));
            renderUrls();
        };

        // Clear All
        clearAllBtn.addEventListener('click', () => {
            if (confirm('Are you sure you want to clear all saved URLs?')) {
                savedUrls = [];
                localStorage.removeItem('linkbolt_urls');
                renderUrls();
                resultBox.classList.remove('visible');
            }
        });

        // Redirect Handler via Hash
        function handleHashRedirect() {
            const hash = window.location.hash.substring(1);
            if (hash) {
                const found = savedUrls.find(item => item.code === hash);
                if (found) {
                    window.location.replace(found.original);
                }
            }
        }

        // Initial check on load
        handleHashRedirect();
        renderUrls();
    </script>
</body>
</html>
